name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: '1.97.0'
          components: rustfmt
          cache-workspaces: interop/yrs-oracle -> target

      - run: npm ci
      - run: npm run interop:generate
      - run: npm run test:interop
      - run: ./gradlew check consumerSmokeTest consumerKotlinCompatibilityTest --no-daemon
      - run: npm run test:security
      - run: npm audit --audit-level=high
      - run: npm run interop:check-clean
      - run: git diff --exit-code
